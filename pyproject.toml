[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-painting"
version = "0.1.0"
description = "Latent-composition painting world models"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.24,<2", "Pillow>=10"]

[project.optional-dependencies]
tracking = ["wandb"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
test = ["pytest>=8"]

[project.scripts]
latent-paint = "painting.cli:main"

[tool.setuptools.packages.find]
include = ["painting*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
